<!-- Categories -->
<section class="facet facet-categories" aria-labelledby="facet-categories-title">
  <h3 class="facet-title" id="facet-categories-title">Categories</h3>
  <ul class="option-list">
    @for (category of categoryList; track category.slug) {
      <li>
        @if (lockedCategory(); as locked) {
          <a
            class="option"
            [class.is-checked]="category.slug === locked"
            [routerLink]="['/product-category', category.slug]"
            queryParamsHandling="merge"
            [queryParams]="{ page: null }"
            [attr.aria-current]="category.slug === locked ? 'page' : null"
          >
            <span class="box" aria-hidden="true"></span>
            <span class="name">{{ category.name }}</span>
            <span class="count"> ({{ category.count }})</span>
          </a>
        } @else {
          <label class="option" [class.is-checked]="categories().includes(category.slug)">
            <input
              type="checkbox"
              [value]="category.slug"
              [checked]="categories().includes(category.slug)"
              (change)="toggleCategory(category.slug, $any($event.target).checked)"
            />
            <span class="name">{{ category.name }}</span>
            <span class="count"> ({{ category.count }})</span>
          </label>
        }
      </li>
    }
  </ul>
</section>
