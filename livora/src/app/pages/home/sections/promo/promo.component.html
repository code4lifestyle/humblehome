<section class="promo">
  <div class="container">
    <div class="promo__grid">
      @for (offer of offers; track offer.title) {
        <article class="offer" [class]="'offer--' + offer.photo">
          <h3 class="offer__eyebrow">{{ offer.eyebrow }}</h3>
          <p class="offer__title">{{ offer.title }}</p>
          <a class="offer__link" routerLink="/shop">
            Shop Now
            <svg
              viewBox="0 0 20 20"
              width="24"
              height="24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M15.165 14.166C15.165 14.7183 14.7173 15.166 14.165 15.166C13.6129 15.1658 13.165 14.7182 13.165 14.166V8.24707L6.53906 14.873C6.14854 15.2636 5.51552 15.2636 5.125 14.873C4.73462 14.4825 4.73452 13.8495 5.125 13.459L11.751 6.83301H5.83203C5.27975 6.83301 4.83203 6.38529 4.83203 5.83301C4.83203 5.28072 5.27975 4.83301 5.83203 4.83301H14.165C14.7173 4.83301 15.165 5.28072 15.165 5.83301V14.166Z"
              />
            </svg>
          </a>
        </article>
      }
    </div>
  </div>
</section>
