<div class="actions">
  <button
    type="button"
    class="action"
    aria-label="Search products"
    aria-haspopup="dialog"
    (click)="layout.openSearch()"
  >
    <app-svg-icon name="search" />
  </button>

  <button
    type="button"
    class="burger"
    aria-label="Open menu"
    aria-haspopup="dialog"
    [attr.aria-expanded]="layout.mobileMenuOpen()"
    (click)="layout.openMobileMenu()"
  >
    <app-svg-icon name="menu" />
  </button>
</div>
