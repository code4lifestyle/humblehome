<div class="chatbot-widget">
  <button
    type="button"
    class="chatbot-bubble"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-label="Chat with Humble Home"
    title="Chat with Humble Home"
  >
    @if (isOpen()) {
      <span class="chatbot-bubble-icon" aria-hidden="true">&times;</span>
    } @else {
      <svg class="chatbot-bubble-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
  </button>

  @if (isOpen()) {
    <section class="chatbot-panel" role="dialog" aria-label="Humble Home chat">
      <header class="chatbot-panel-header">
        <div>
          <p class="chatbot-panel-title">Humble Home</p>
          <p class="chatbot-panel-subtitle">Custom furniture, curtains &amp; marble in Dubai</p>
        </div>
        <button type="button" class="chatbot-panel-close" (click)="close()" aria-label="Close chat">
          &times;
        </button>
      </header>

      <div class="chatbot-messages">
        @for (message of messages(); track $index) {
          <div class="chatbot-message chatbot-message--{{ message.from }}">
            <p>{{ message.text }}</p>
            @if (message.action) {
              <a
                class="chatbot-message-action"
                [href]="message.action.href"
                target="_blank"
                rel="noopener noreferrer"
              >
                {{ message.action.label }}
              </a>
            }
          </div>
        }
      </div>

      <div class="chatbot-quick-replies">
        @for (reply of quickReplies; track reply.value) {
          <button type="button" class="chatbot-chip" (click)="ask(reply.value)">
            {{ reply.label }}
          </button>
        }
      </div>

      <div class="chatbot-input-row">
        <label class="chatbot-input-label" for="chatbot-input">Type your question</label>
        <input
          #chatInput
          id="chatbot-input"
          type="text"
          class="chatbot-input"
          placeholder="Type your question..."
          autocomplete="off"
          (keydown.enter)="send(chatInput.value); chatInput.value = ''"
        />
        <button
          type="button"
          class="chatbot-send"
          (click)="send(chatInput.value); chatInput.value = ''"
          aria-label="Send message"
        >
          Send
        </button>
      </div>

      <a class="chatbot-whatsapp" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer">
        Prefer to talk to a person? Chat on WhatsApp
      </a>
    </section>
  }
</div>
