<span class="stars" aria-hidden="true">
  @for (star of stars(); track $index) {
    <i [class]="star" aria-hidden="true"></i>
  }
</span>
@if (showValue()) {
  <span class="value" aria-hidden="true">{{ display() }}</span>
}
@if (count() != null) {
  <span class="count" aria-hidden="true">({{ count() }})</span>
}
