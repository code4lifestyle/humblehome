<article
  class="post"
  [class.is-highlight]="variant() === 'highlight'"
  [class.is-row]="variant() === 'row'"
>
  <div class="media">
    <!-- decorative duplicate of the title link: one tab stop per card -->
    <a class="media-link" [routerLink]="link()" tabindex="-1" aria-hidden="true">
      <img
        [src]="post().image"
        [alt]="post().title"
        width="1024"
        height="576"
        loading="lazy"
        decoding="async"
      />
    </a>
  </div>

  <div class="body">
    @if (showMeta()) {
      <div class="meta">
        <span class="date">
          <svg
            viewBox="0 0 20 20"
            width="14"
            height="14"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M16.75 9.08105H3.25V14.3311C3.25 15.0433 3.25027 15.5329 3.28125 15.9121C3.3115 16.282 3.36714 16.481 3.44043 16.625C3.60811 16.9541 3.87598 17.2218 4.20508 17.3896C4.34909 17.463 4.54856 17.5186 4.91895 17.5488C5.2982 17.5798 5.78756 17.5811 6.5 17.5811H13.5C14.2125 17.5811 14.7018 17.5798 15.0811 17.5488C15.4515 17.5186 15.6509 17.463 15.7949 17.3896C16.124 17.2218 16.3919 16.9541 16.5596 16.625C16.6329 16.481 16.6885 16.282 16.7188 15.9121C16.7497 15.5329 16.75 15.0433 16.75 14.3311V9.08105ZM12.583 4.99707V4.08105H7.41699V4.99707C7.41699 5.41118 7.08106 5.7469 6.66699 5.74707C6.25278 5.74707 5.91699 5.41128 5.91699 4.99707V4.08301C5.50443 4.08513 5.18464 4.0906 4.91895 4.1123C4.54853 4.14258 4.3491 4.1981 4.20508 4.27148C3.87595 4.43928 3.60816 4.70697 3.44043 5.03613C3.36705 5.18017 3.31152 5.37953 3.28125 5.75C3.25028 6.12923 3.25 6.61875 3.25 7.33105V7.58105H16.75V7.33105C16.75 6.61875 16.7497 6.12922 16.7188 5.75C16.6885 5.37953 16.633 5.18017 16.5596 5.03613C16.3918 4.70692 16.124 4.43927 15.7949 4.27148C15.6509 4.19809 15.4515 4.14258 15.0811 4.1123C14.8154 4.0906 14.4956 4.08513 14.083 4.08301V4.99707C14.083 5.41128 13.7472 5.74707 13.333 5.74707C12.9189 5.74691 12.583 5.41119 12.583 4.99707ZM18.25 14.3311C18.25 15.0186 18.251 15.5797 18.2139 16.0342C18.176 16.4973 18.0945 16.916 17.8955 17.3066C17.5839 17.918 17.0869 18.415 16.4756 18.7266C16.0849 18.9257 15.6664 19.0061 15.2031 19.0439C14.7486 19.0811 14.1877 19.0811 13.5 19.0811H6.5C5.81231 19.0811 5.25139 19.0811 4.79688 19.0439C4.33364 19.0061 3.91514 18.9257 3.52442 18.7266C2.91309 18.415 2.41611 17.918 2.10449 17.3066C1.90549 16.916 1.824 16.4973 1.78614 16.0342C1.74901 15.5797 1.75 15.0186 1.75 14.3311V7.33105C1.75 6.64352 1.74903 6.08238 1.78614 5.62793C1.82398 5.16469 1.90543 4.74619 2.10449 4.35547C2.41609 3.74395 2.91289 3.24616 3.52442 2.93457C3.91512 2.73551 4.33366 2.65504 4.79688 2.61719C5.11558 2.59115 5.48664 2.58516 5.91699 2.58301V1.66406C5.91699 1.24985 6.25278 0.914062 6.66699 0.914062C7.08106 0.914237 7.41699 1.24996 7.41699 1.66406V2.58105H12.583V1.66406C12.583 1.24995 12.9189 0.91422 13.333 0.914062C13.7472 0.914062 14.083 1.24985 14.083 1.66406V2.58301C14.5134 2.58516 14.8844 2.59115 15.2031 2.61719C15.6664 2.65504 16.0849 2.73552 16.4756 2.93457C17.0871 3.24618 17.5839 3.744 17.8955 4.35547C18.0946 4.74619 18.176 5.1647 18.2139 5.62793C18.251 6.08238 18.25 6.64352 18.25 7.33105V14.3311Z"
            />
          </svg>
          <time [attr.datetime]="post().date">{{ post().date | date: 'MMMM d, y' }}</time>
        </span>
        @if (categories().length) {
          <span class="cats">
            @for (cat of categories(); track cat.slug) {
              <a class="cat" [routerLink]="['/category', cat.slug]">{{ cat.name }}</a>
            }
          </span>
        }
      </div>
    }

    <h3 class="title">
      <a [routerLink]="link()">{{ post().title }}</a>
    </h3>

    @if (variant() === 'card') {
      <p class="excerpt">{{ post().excerpt }}</p>
    }

    <div class="more">
      <a class="read-more" [routerLink]="link()" [attr.aria-label]="'Read more: ' + post().title">
        Read More
        <svg
          viewBox="0 0 20 20"
          width="24"
          height="24"
          fill="currentColor"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M15.165 14.166C15.165 14.7183 14.7173 15.166 14.165 15.166C13.6129 15.1658 13.165 14.7182 13.165 14.166V8.24707L6.53906 14.873C6.14854 15.2636 5.51552 15.2636 5.125 14.873C4.73462 14.4825 4.73452 13.8495 5.125 13.459L11.751 6.83301H5.83203C5.27975 6.83301 4.83203 6.38529 4.83203 5.83301C4.83203 5.28072 5.27975 4.83301 5.83203 4.83301H14.165C14.7173 4.83301 15.165 5.28072 15.165 5.83301V14.166Z"
          />
        </svg>
      </a>
    </div>
  </div>
</article>
